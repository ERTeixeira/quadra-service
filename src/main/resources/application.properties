spring.application.name=quadra-service

# Configura\u00e7\u00e3o da Conex\u00e3o com o PostgreSQL e o Schema de Quadras
spring.datasource.url=jdbc:postgresql://localhost:5432/arena_db?currentSchema=quadra
spring.datasource.username=postgres
spring.datasource.password=senha133

# Configura\u00e7\u00f5es do Hibernate / JPA
# create: apaga e recria as tabelas a cada inicialização, sempre igual às entidades (os dados são perdidos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=quadra

# Porta onde o microsservi\u00e7o vai rodar (opcional, padr\u00e3o \u00e9 8080)
server.port=8080